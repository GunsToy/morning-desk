services:
  morning-desk:
    build: .
    image: morning-desk:latest
    container_name: morning-desk
    restart: unless-stopped
    ports:
      - "4123:4123"
    environment:
      - NODE_ENV=production
      - PORT=4123
      - HOST=0.0.0.0
      # Optional: fix the admin password here instead of choosing it on first visit.
      # - ADMIN_PASSWORD=change-me-please
      # Optional: address of an nginx in front of the app (see README, "Profiles and the admin password").
      # - TRUST_PROXY=172.18.0.1
      # "Sign in with Poodle House": put these in a .env file next to this one (see README, "Sign in with Poodle House").
      # .env is not in git, so the nightly update never touches it. Left empty, the button does not appear.
      - SSO_ISSUER=${SSO_ISSUER:-}
      - SSO_CLIENT_ID=${SSO_CLIENT_ID:-}
      - SSO_CLIENT_SECRET=${SSO_CLIENT_SECRET:-}
      - SSO_PUBLIC_URL=${SSO_PUBLIC_URL:-}
      - SSO_NAME=${SSO_NAME:-}
      - SSO_ADMIN_GROUP=${SSO_ADMIN_GROUP:-}
    volumes:
      # Persist config (Growatt token + location). Create the file first if it does not exist.
      - ./config.json:/app/config.json
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4123/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
