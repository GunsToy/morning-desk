# Runs npm test on every push and pull request, on the Node version the Docker image uses.
# Installs pull main at 04:15, so a red run here is the warning before a broken change ships.
name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The tests use only Node's built-in modules, so no npm install is needed.
      - run: npm test
