<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#146b4a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Sign in · Morning Desk</title>
  <link rel="preload" href="fonts/marcellus.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/figtree.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="images/desk.png" type="image/png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body">
  <!-- Icons: shapes from Lucide (https://lucide.dev), ISC License, Copyright (c) Lucide Contributors. -->
  <!-- images/: copied from the Poodle House theme (see DESIGN.md, Assets) -->
  <aside class="login-photo">
    <img src="images/poodle.jpg" alt="" />
    <p class="plaque">Morning Desk</p>
  </aside>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title" data-loading>
      <img class="login-mark" src="images/desk.png" alt="" width="96" height="96" />
      <h1 class="login-title" id="login-title">Sign in</h1>
      <p class="login-intro" id="login-intro" hidden></p>
      <form id="login-form" class="login-form">
        <div class="login-field">
          <label for="login-username">Username</label>
          <input id="login-username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="login-field">
          <label for="login-password">Password</label>
          <div class="login-secret">
            <input id="login-password" name="password" type="password" autocomplete="current-password" required>
            <button type="button" class="login-eye" id="login-eye" aria-label="Show password" aria-pressed="false">
              <svg class="icon eye-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="icon eye-hide" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
            </button>
          </div>
        </div>
        <div class="login-field" id="login-confirm-row" hidden>
          <label for="login-confirm">Confirm password</label>
          <input id="login-confirm" name="confirm" type="password" autocomplete="new-password">
        </div>
        <label class="check-row login-remember"><input type="checkbox" name="remember" checked> Remember me</label>
        <p class="settings-status login-status" id="login-status" role="alert"></p>
        <button type="submit" class="login-submit" id="login-submit">Sign in</button>
      </form>
      <div class="login-sso" id="login-sso" hidden>
        <p class="login-or"><span>or</span></p>
        <a class="login-sso-button" id="login-sso-button" href="/auth/sso/start">Sign in with Poodle House</a>
      </div>
      <p class="login-note" id="login-note">No sign-in yet? Ask the house admin.</p>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
